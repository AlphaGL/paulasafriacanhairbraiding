{% extends "base.html" %}

{% block title %}Bad Request | {{ business.business_name }}{% endblock %}

{% block content %}
<section class="section" style="text-align:center;">
  <div class="container" style="max-width:560px;">
    <span class="badge">400</span>
    <h2>Something about that request wasn't right</h2>
    <p style="color:var(--muted)">Please try again — if you typed a web address directly, double-check it and try once more.</p>
    <div style="margin-top:24px;">
      <a href="{% url 'core:home' %}" class="btn btn-gold">Back to Home</a>
    </div>
  </div>
</section>
{% endblock %}
