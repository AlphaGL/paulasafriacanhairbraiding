{% extends "base.html" %}

{% block title %}Page Not Found | {{ business.business_name }}{% endblock %}

{% block content %}
<section class="section" style="text-align:center;">
  <div class="container" style="max-width:560px;">
    <span class="badge">404</span>
    <h2>We couldn't find that page</h2>
    <p style="color:var(--muted)">The page you're looking for may have moved, or the link might be off. Let's get you back on track.</p>
    <div style="display:flex; gap:16px; justify-content:center; margin-top:24px; flex-wrap:wrap;">
      <a href="{% url 'core:home' %}" class="btn btn-gold">Back to Home</a>
      <a href="{% url 'styles:list' %}" class="btn btn-outline">Browse Styles</a>
    </div>
  </div>
</section>
{% endblock %}
